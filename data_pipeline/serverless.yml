service: dataPipeline


frameworkVersion: '3'

provider:
  stackName: ${self:custom.stage}-data-pipeline
  versionFunctions: false
  name: aws
  timeout: 900
  ecr:
    images:
      data-pipeline:
        path: ./
  region: ${file(./config/${self:custom.stage}.yml):region}
  logRetentionInDays: 7
  iam:
    role:
      tags:
      name: ${self:custom.stage}-${self:service}
      statements:
        - Effect: Allow
          Action:
            - "s3:*"
            - "glue:*"
            - "athena:*"
            - "logs:*"
            - "cloudwatch:*"
          Resource:
            - "*"
        - Effect: Allow
          Action:
            - "ecr:BatchGetImage"
            - "ecr:GetDownloadUrlForLayer"
          Resource:
            - "arn:aws:ecr:*:*:repository/*"
  deploymentBucket:
    name: ${file(./config/${self:custom.stage}.yml):deploy_bucket}
  environment: ${file(./config/${self:custom.stage}.yml):env_vars}

functions:
  processSalesData:
    description: Processing Sales Data
    events:
      - schedule:
          rate: cron(0 2 * * ? *)
    name: ${self:service}-${self:custom.stage}-process-sales-data
    image:
      name: data-pipeline
      command:
        - functions/process_sales_data.process_sales_function
      entryPoint:
        - "/lambda-entrypoint.sh"

  

custom:
  stage: ${opt:stage, 'development'}
  #we will copy the same function and create another one and that will be customer processing function from line 42 and